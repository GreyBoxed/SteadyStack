{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}steadystack{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v={{ asset_version }}">
    <script src="{% static 'js/keep-scroll.js' %}?v={{ asset_version }}" defer></script>
    <script src="{% static 'js/live-refresh.js' %}?v={{ asset_version }}" defer></script>
    {% block head %}{% endblock %}
  </head>
  <body>{% block body %}{% endblock %}</body>
</html>
