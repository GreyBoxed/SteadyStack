<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone — stop trading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #0B0C0E; font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #F0A640; } a:hover { color: #FFC470; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0B0C0E; color: #E9E7E2; overflow: hidden;">

  <header style="height: 56px; flex-shrink: 0; box-sizing: border-box; border-bottom: 1px solid #1E2127; background: #0E1013; display: flex; align-items: center; padding: 0 12px 0 6px; gap: 4px;">
    <a href="MobileToday.dc.html" aria-label="Back to today" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #B4B0A8; font-size: 19px;">&#8592;</a>
    <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">{{title}}</span>
  </header>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0;">

    <section style="flex-shrink: 0; box-sizing: border-box; background: #131518; border: 1px solid {{border}}; border-radius: 12px; padding: 18px; box-shadow: inset 3px 0 0 {{bar}};">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; color: #8F8C85;">{{kicker}}</div>
      <div style="font-size: 24px; font-weight: 600; letter-spacing: -0.025em; color: {{color}}; margin-top: 8px; line-height: 1.25;">{{headline}}</div>
      <div style="font-size: 13px; color: #B4B0A8; line-height: 1.6; margin-top: 11px;">{{blurb}}</div>
    </section>

    <section style="flex-shrink: 0; box-sizing: border-box; background: #131518; border: 1px solid #1E2127; border-radius: 12px; overflow: hidden;">
      <div style="height: 38px; box-sizing: border-box; border-bottom: 1px solid #1E2127; display: flex; align-items: center; padding: 0 14px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; color: #8F8C85;">{{listKicker}}</span>
      </div>
      <sc-for list="{{does}}" as="d" hint-placeholder-count="4">
        <div style="display: flex; gap: 11px; padding: 12px 14px; border-bottom: 1px solid #191C21;">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: {{d.color}}; margin-top: 6px; flex-shrink: 0;"></span>
          <span style="font-size: 13px; color: #B4B0A8; line-height: 1.5;">{{d.text}}</span>
        </div>
      </sc-for>
    </section>

    <section style="flex-shrink: 0; box-sizing: border-box; background: #131518; border: 1px solid #1E2127; border-radius: 12px; overflow: hidden;">
      <div style="height: 38px; box-sizing: border-box; border-bottom: 1px solid #1E2127; display: flex; align-items: center; padding: 0 14px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; color: #46C88A;">WHAT IT DOES NOT DO</span>
      </div>
      <sc-for list="{{doesnt}}" as="d" hint-placeholder-count="3">
        <div style="display: flex; gap: 11px; padding: 12px 14px; border-bottom: 1px solid #191C21;">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #46C88A; margin-top: 6px; flex-shrink: 0;"></span>
          <span style="font-size: 13px; color: #B4B0A8; line-height: 1.5;">{{d}}</span>
        </div>
      </sc-for>
    </section>

    <div style="margin-top: auto; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px;">
      <button type="button" onClick="{{act}}" style="height: 56px; border: 1px solid {{ctaBorder}}; border-radius: 8px; background: {{ctaBg}}; color: {{ctaFg}}; font-family: 'Space Grotesk', sans-serif; font-size: 15.5px; font-weight: 600; cursor: pointer;">{{ctaLabel}}</button>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #83807A; text-align: center; line-height: 1.6;">{{footer}}</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F0A640","options":["#F0A640","#46C88A","#6FA8DC","#D97757"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stopped: false };
  }

  renderVals() {
    var self = this;
    var a = this.props.accent || '#F0A640';
    var GR = '#46C88A', RD = '#F06A52', T1 = '#E9E7E2', T2 = '#B4B0A8', T3 = '#8F8C85', T4 = '#83807A';
    var stopped = !!(this.state && this.state.stopped);

    var does = stopped
      ? [
          { color: T4, text: '2 open orders were cancelled at 11:33:04. Both were confirmed gone before anything else happened.' },
          { color: T4, text: 'No further order will be placed today. The remaining 42 ticks will fire and do nothing.' },
          { color: T4, text: 'The day closed as PARTIAL with 5 of 7 filled.' },
          { color: a, text: '₹1,105.80 unspent has moved to carry and is first in line tomorrow.' }
        ]
      : [
          { color: RD, text: 'Cancel the 2 orders currently resting at the broker.' },
          { color: RD, text: 'Place nothing further today — including the 15:00 market fallback.' },
          { color: a, text: 'End the day as PARTIAL, because 5 of 7 shares have already filled.' },
          { color: a, text: 'Move the ₹1,105.80 you have not spent into carry, for tomorrow.' }
        ];

    var doesnt = [
      'It does not sell anything. Shares already bought stay bought.',
      'Fills already taken stand — they are real trades and cannot be undone here.',
      'Tomorrow is unaffected. A new tradesheet is built as usual at 09:45.'
    ];

    return {
      a: a, does: does, doesnt: doesnt,
      title: stopped ? 'Stopped' : 'Stop trading',
      kicker: stopped ? 'TODAY IS HALTED' : 'THIS ENDS THE DAY EARLY',
      headline: stopped ? 'Nothing more will be placed today' : 'Stop buying ITC and close the day',
      color: stopped ? T1 : RD,
      border: stopped ? '#1E2127' : '#45211C',
      bar: stopped ? T4 : RD,
      blurb: stopped
        ? 'Halted at 11:33 by operator, recorded against ts-2026-09-23 with the reason you gave. The ladder is done for the day.'
        : 'Use this when something is wrong and you want the money to stop moving — a price that looks broken, a name you no longer want, a decision you want to take at a desk instead of on a train.',
      listKicker: stopped ? 'WHAT HAPPENED' : 'WHAT IT WILL DO',
      ctaLabel: stopped ? 'Back to today' : 'Hold to stop trading',
      ctaBg: stopped ? 'transparent' : '#1C1210',
      ctaFg: stopped ? T2 : RD,
      ctaBorder: stopped ? '#2B2F36' : '#45211C',
      footer: stopped
        ? 'the halt is in the audit trail with its time, actor and reason'
        : 'press and hold for two seconds — too easy to hit by accident otherwise',
      act: function () { self.setState({ stopped: !stopped }); }
    };
  }
}
</script>
</body>
</html>
