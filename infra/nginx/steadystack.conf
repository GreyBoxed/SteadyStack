#
# nginx in front of gunicorn. HTTPS only, with HSTS (M50).
#
# `__DOMAIN__` is substituted at boot. This file names the certificate, so it
# is installed only once one exists: until then bootstrap serves
# steadystack-http.conf, which answers the ACME challenge and nothing else, and
# certbot obtains the certificate through it (webroot, never by editing this
# file). Renewal reloads nginx through certbot's deploy hook.
#

# conf.d files are included at the http level, which is where zones live.
limit_req_zone $binary_remote_addr zone=steadystack_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=steadystack_open:1m rate=60r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # The one path that stays on port 80, so a certificate can be renewed
    # without taking the site down.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` on the listen line rather than `http2 on;`, which nginx before
    # 1.25.1 does not know. Newer nginx warns about it and serves HTTP/2 anyway.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;

    # HSTS, nosniff, the referrer policy and X-Frame-Options come from Django
    # (config/settings/prod.py) on every page; setting them here too would send
    # each twice. The static files below carry their own.

    client_max_body_size 4m;   # a rebalance CSV, and nothing larger

    access_log /var/log/steadystack/nginx-access.log;
    error_log  /var/log/steadystack/nginx-error.log;

    # The outside probe calls this every thirty seconds; logging each one
    # would bury every line worth reading.
    location = /health/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The sign-in forms and the two endpoints the internet can reach without
    # signing in, rate-limited per address before Django sees them. The app's
    # own throttle counts failures; this caps attempts of any kind.
    location ~ ^/(accounts|m)/login/$ {
        limit_req zone=steadystack_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(orders/kite/postback|broker/kite/callback)/$ {
        limit_req zone=steadystack_open burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # collectstatic's output: the app's own files and the admin's.
    location /static/ {
        alias /opt/steadystack/staticfiles/;
        expires 30d;
        access_log off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # The connecting address, replacing anything the client sent: the
        # login throttle and the audit trail key on it, and a header the
        # client wrote would let it choose.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # SECURE_PROXY_SSL_HEADER reads this. Set from $scheme rather than
        # passed through, so a client cannot claim HTTPS over plain HTTP.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 75s;
    }
}
