#
# Before there is a certificate: port 80, the ACME challenge, and nothing
# else. bootstrap installs this, runs certbot against it, and replaces it
# with steadystack.conf once the certificate exists. Nothing is ever served over
# plain HTTP -- every other path is refused rather than proxied.
#

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 503;
    }
}
